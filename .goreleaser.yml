# Builds and publishes binaries to a GitHub release on every v* tag (see the release job in .github/workflows/ci.yml).
# Documentation: https://goreleaser.com/customization/
version: 2

builds:
  - main: ./cmd/go-template
    binary: go-template
    env:
      - CGO_ENABLED=0
    flags:
      - -trimpath
    ldflags:
      - -s -w -X main.version={{ .Version }}
    goos: [linux, darwin, windows]
    goarch: [amd64, arm64]

archives:
  - formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]

checksum:
  name_template: checksums.txt

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
