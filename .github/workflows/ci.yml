name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      ### uncomment to enable publishing the docker image to GitHub Container Registry
      #packages: write
    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache-dependency-path: "**/go.sum"

      - run: ./scripts/setup.sh

      - run: ./scripts/local_ci.sh

      - name: Sonar
        if: env.SONAR_TOKEN != ''
        uses: SonarSource/sonarqube-scan-action@e805d875275f728fac1885b413934be6d7c63f65 # v8.4.1

      - name: Sonar (skipped)
        if: env.SONAR_TOKEN == ''
        run: echo "::notice::Sonar skipped. To enable it, add a SONAR_TOKEN secret (see README)."

      ### Publish image to GitHub Container Registry - uncomment to enable
      # - name: Publish image
      #   if: github.event_name == 'push'
      #   env:
      #     GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      #   run: |
      #     image="ghcr.io/$(echo "$GITHUB_REPOSITORY" | tr '[:upper:]' '[:lower:]')"
      #     if [ "$GITHUB_REF_TYPE" = tag ]; then tag=$GITHUB_REF_NAME; else tag=latest; fi
      #     echo "$GITHUB_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
      #     for t in "$tag" "$GITHUB_SHA"; do
      #       docker tag go-template "$image:$t"
      #       docker push "$image:$t"
      #     done

  release:
    if: github.ref_type == 'tag'
    needs: ci
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache-dependency-path: "**/go.sum"

      - name: Publish binaries to a GitHub release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: go tool -modfile=tools/go.mod goreleaser release --clean
